name: Deploy Dasheng Brief Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/deploy-dasheng-pages.yml"
      - "scripts/build_dasheng_brief_site.py"
      - "dasheng_brief_assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build static site
        run: |
          python scripts/build_dasheng_brief_site.py \
            --source-dir dasheng_brief_assets \
            --output-dir work/dasheng_brief_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: work/dasheng_brief_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
